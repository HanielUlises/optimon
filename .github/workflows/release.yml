name: release

# Build a static (musl) binary and publish it to a GitHub Release
# whenever a version tag is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker (musl)
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          bin=target/${{ matrix.target }}/release/optimon
          strip "$bin" || true
          tar -czf "optimon-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" optimon \
            -C "$GITHUB_WORKSPACE" config.toml README.md LICENSE

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: optimon-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          generate_release_notes: true
